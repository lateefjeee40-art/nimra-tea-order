<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SN FOODS Order</title>
    <style>
        body { background-color: #fbcce7; font-family: Arial, sans-serif; text-align: center; padding: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 500px; margin: auto; }
        .card { background: #fff; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
        img { width: 100%; height: 100px; object-fit: contain; }
        input { width: 90%; padding: 8px; margin-top: 5px; }
        button { width: 100%; padding: 10px; margin-top: 20px; background: #25d366; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>SN FOODS</h2>

    <div class="grid">
        <div class="card">
            <img src="https://i.postimg.cc/qvFdC0H1/p1.jpg" alt="20g">
            <p>20 Gram (ڈبی)</p>
            <input type="number" id="p1" placeholder="تعداد">
        </div>
        <div class="card">
            <img src="https://i.postimg.cc/NjHdpwrr/p2.jpg" alt="40g">
            <p>40 Gram (ڈبی)</p>
            <input type="number" id="p2" placeholder="تعداد">
        </div>
        <div class="card">
            <img src="https://i.postimg.cc/LsS3DgSK/p3.jpg" alt="75g">
            <p>75 Gram (ڈبی)</p>
            <input type="number" id="p3" placeholder="تعداد">
        </div>
        <div class="card">
            <img src="https://i.postimg.cc/QdGQNKH0/4.jpg" alt="150g">
            <p>150 Gram (جار)</p>
            <input type="number" id="p4" placeholder="تعداد">
        </div>
        <div class="card">
            <img src="https://i.postimg.cc/Z0kdqXKz/5.jpg" alt="Special">
            <p>Special (پاؤچ)</p>
            <input type="number" id="p5" placeholder="تعداد">
        </div>
    </div>

    <button onclick="sendOrder()">واٹس ایپ پر آرڈر بھیجیں</button>

    <script>
        function sendOrder() {
            let msg = "السلام علیکم، میرا آرڈر درج ذیل ہے:%0A";
            msg += "20g: " + document.getElementById('p1').value + "%0A";
            msg += "40g: " + document.getElementById('p2').value + "%0A";
            msg += "75g (ڈبی): " + document.getElementById('p3').value + "%0A";
            msg += "150g (جار): " + document.getElementById('p4').value + "%0A";
            msg += "Special (پاؤچ): " + document.getElementById('p5').value;
            window.open("https://wa.me/923009695663?text=" + msg);
        }
    </script>
</body>
</html>
